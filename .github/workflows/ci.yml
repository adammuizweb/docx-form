name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, fileinfo, json, libxml, mbstring, pdo, pdo_mysql, zip
          coverage: none
      - name: Validate manifest
        run: php -r 'json_decode(file_get_contents("plugin.json"), true, 64, JSON_THROW_ON_ERROR);'
      - name: Lint PHP
        run: for file in $(git ls-files '*.php'); do php -l "$file"; done
      - name: Run standalone tests
        env:
          DXF_CONTRACT_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;charset=utf8mb4
          DXF_CONTRACT_MYSQL_USER: root
          DXF_CONTRACT_MYSQL_PASSWORD: root
        run: for test in tests/*.php; do php "$test"; done
      - name: Build verified package
        run: php tools/build-package.php "$RUNNER_TEMP/docx-form-0.3.1.zip"
